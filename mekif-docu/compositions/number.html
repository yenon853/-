<template>
  <style>
    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-400.ttf"); font-weight: 400; }
    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-700.ttf"); font-weight: 700; }
    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-900.ttf"); font-weight: 900; }
    @font-face { font-family: "Frank Ruhl Libre"; src: url("assets/fonts/FrankRuhl-400.ttf"); font-weight: 400; }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse 90% 70% at 50% 52%, #12276a 0%, #0b1844 55%, #050c26 100%);
      font-family: "Heebo", sans-serif;
    }
    #num-cam { position: absolute; inset: 0; }
    .num-chap {
      position: absolute;
      top: 250px;

      display: flex;
      align-items: center;
      gap: 22px;
      direction: rtl;
    }
    #num-chap-n { font-family: "JetBrains Mono", monospace; font-size: 34px; font-weight: 700; color: #00bcd4; }
    #num-chap-line { width: 120px; height: 3px; background: #00bcd4; transform-origin: 100% 50%; }

    #num-digits {
      position: absolute;

    }
    .num-col { height: 300px; overflow: hidden; }
    .num-strip { display: flex; flex-direction: column; }
    .num-strip span { height: 300px; display: block; text-align: center; }
    #num-pct {
      color: #00bcd4;

      opacity: 0;
      text-shadow: 0 3px 0 #00a2b8, 0 6px 0 #008ea2, 0 9px 0 #007a8c, 0 18px 24px rgba(0, 0, 0, 0.5);
    }
    #num-stage {
      position: absolute;
      left: 0;
      top: 640px;
      width: 1080px;
      height: 760px;
      perspective: 1300px;
    }
    #num-grid {
      position: absolute;
      left: 202px;

      transform-style: preserve-3d;

    .num-dot {

    .num-on {
      position: absolute;

    #num-shock {
      position: absolute;

    #num-cap {
      position: absolute;

    .num-m { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 4px; }

    #num-src {
      position: absolute;
      top: 1570px;

      right: 0;
      text-align: center;

      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="number" data-width="1080" data-height="1920">
    <div id="num-cam" data-layout-allow-overflow>
      <div class="num-chap">
        <span id="num-chap-n">02</span><span id="num-chap-line"></span><span id="num-chap-t">ההישג</span>
      </div>
      <div id="num-digits">
        <div class="num-col"><div id="num-tens" class="num-strip"></div></div>
        <div class="num-col"><div id="num-ones" class="num-strip"></div></div>
        <div id="num-pct">%</div>
      </div>
      <div id="num-stage" data-layout-ignore>
        <div id="num-grid"></div>
        <div id="num-shock"></div>
      </div>
      <div id="num-cap"><span class="num-m"><span>זכאות</span></span> <span class="num-m"><span>לבגרות</span></span></div>
      <div id="num-src">98 מכל 100 תלמידי י״ב · מתוך אתר בית הספר</div>
    </div>
  </div>
  <script>
    const ORDER = [];
    (function () {
      const tens = document.getElementById("num-tens");
      for (let i = 0; i <= 9; i++) tens.insertAdjacentHTML("beforeend", `<span>${i}</span>`);
      const ones = document.getElementById("num-ones");
      for (let k = 0; k < 3; k++) for (let i = 0; i <= 9; i++) ones.insertAdjacentHTML("beforeend", `<span>${i}</span>`);
      for (let i = 0; i <= 8; i++) ones.insertAdjacentHTML("beforeend", `<span>${i}</span>`);
      // 100 dots; light order runs from the centre outwards, the two farthest stay dark
      const grid = document.getElementById("num-grid");
      const cells = [];
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const id = r * 10 + c;
          grid.insertAdjacentHTML("beforeend", `<div class="num-dot" id="num-d${id}" style="left:${c * 70}px;top:${r * 70}px"><div class="num-on"></div></div>`);
          const d = Math.hypot(r - 4.5, c - 4.5) + (r * 10 + c) * 0.0001;
          cells.push([d, id]);
        }
      }
      cells.sort((a, b) => a[0] - b[0]);
      cells.forEach(([, id]) => ORDER.push(id));
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#num-chap-n", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.4);
    tl.fromTo("#num-chap-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 0.45);
    tl.fromTo("#num-chap-t", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.55);

    // the grid swings up into view, tilted like a board on a table
    tl.fromTo("#num-grid", { rotationX: 62, rotationZ: -8, y: 120, opacity: 0 }, { rotationX: 24, rotationZ: -3, y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.3);
    tl.to("#num-grid", { rotationX: 16, rotationZ: 3, duration: 6.5, ease: "sine.inOut" }, 1.3);

    // count and light on one clock; landing on the downbeat at local 2.8 s (abs 20.0)
    const C0 = 0.9, CD = 1.9;
    const ease = gsap.parseEase("power3.inOut");
    tl.fromTo("#num-tens", { y: 0 }, { y: -9 * 300, duration: CD, ease: "power3.inOut" }, C0);
    tl.fromTo("#num-ones", { y: 0 }, { y: -38 * 300, duration: CD, ease: "power3.inOut" }, C0);
    tl.fromTo("#num-pct", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, C0 + CD - 0.2);
    // invert the ease so dot k lights exactly when the counter passes k+1
    const invEase = (v) => {
      let lo = 0, hi = 1;
      for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (ease(m) < v) lo = m; else hi = m; }
      return (lo + hi) / 2;
    };
    for (let k = 0; k < 98; k++) {
      const t = C0 + CD * invEase((k + 1) / 98);
      tl.fromTo(`#num-d${ORDER[k]} .num-on`, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.5)" }, t - 0.12);
    }
    // impact: the lit field pulses out from the centre, a shockwave, the camera takes the hit
    for (let k = 0; k < 98; k++) {
      tl.fromTo(`#num-d${ORDER[k]}`, { scale: 1 }, { scale: 1.3, duration: 0.09, ease: "power2.out", immediateRender: false }, 2.8 + k * 0.004);
      tl.to(`#num-d${ORDER[k]}`, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.5)" }, 2.89 + k * 0.004);
    }
    tl.fromTo("#num-shock", { scale: 0.2, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "expo.out", immediateRender: false }, 2.8);
    tl.fromTo("#num-cam", { scale: 1 }, { scale: 1.06, duration: 0.1, ease: "power2.out" }, 2.8);
    tl.to("#num-cam", { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.45)" }, 2.9);

    tl.fromTo("#num-cap .num-m > span", { yPercent: 110 }, { yPercent: 0, duration: 0.5, stagger: 0.12, ease: "expo.out" }, 3.1);
    tl.fromTo("#num-src", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 3.6);
    window.__timelines["number"] = tl;
  </script>
