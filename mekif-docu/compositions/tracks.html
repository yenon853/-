<template>
  <style>

    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-700.ttf"); font-weight: 700; }

    #trk-speed {

    #trk-speed line {

  </style>
  <div id="root" data-composition-id="tracks" data-width="1080" data-height="1920">
    <svg id="trk-speed" viewBox="0 0 1080 1920" data-layout-ignore></svg>
    <div id="trk-stage" data-layout-ignore>
      <div id="trk-world">
        <div class="trk-card sci"><i></i>פיזיקה</div>
        <div class="trk-card hum"><i></i>מדעי החברה</div>
        <div class="trk-card spc"><i></i>אמנות</div>
        <div class="trk-card sci"><i></i>מדעי המחשב</div>
        <div class="trk-card hum"><i></i>גאוגרפיה</div>
        <div class="trk-card sci"><i></i>כימיה</div>
        <div class="trk-card spc"><i></i>רפואה</div>
        <div class="trk-card sci"><i></i>הנדסת תוכנה</div>
        <div class="trk-card hum"><i></i>עולם ערבי ואסלאם</div>
        <div class="trk-card sci"><i></i>ביולוגיה</div>
        <div class="trk-card spc"><i></i>תקשוב</div>
      </div>
    </div>
    <div class="trk-chap">
      <span id="trk-chap-n">03</span><span id="trk-chap-line"></span><span id="trk-chap-t">המגמות</span>
    </div>
    <div id="trk-legend">
      <span class="trk-leg sci"><i></i>מדעים וטכנולוגיה</span>
      <span class="trk-leg hum"><i></i>רוח וחברה</span>
      <span class="trk-leg spc"><i></i>ייחודיות</span>
    </div>
    <div id="trk-final">
      <span class="trk-fw">כל</span> <span class="trk-fw">כיוון</span><br />
      <span class="trk-fw">פתוח</span><span id="trk-dot"></span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const V = 950; // camera speed, px per second through the tunnel
    const T0 = 0.4;
    const POS = [
      [-220, -330], [230, 300], [-250, 250], [210, -320], [0, -470], [-260, 20],
      [250, -30], [-160, 420], [120, -430], [190, 440], [0, 0],
    ];
    const cards = document.querySelectorAll(".trk-card");
    cards.forEach((el, i) => {
      const z = -(700 + 620 * i);
      // static placement in depth; only opacity is animated on the card itself
      el.style.transform = `translate3d(${POS[i][0]}px, ${POS[i][1]}px, ${z}px) translate(-50%, -50%)`;
      const tIn = Math.max(0, T0 + (-z - 3000) / V);
      const tSharp = T0 + (-z - 900) / V;
      const tOut = T0 + (-z + 560) / V;
      // depth of field: soft in the distance, sharp at reading distance, smeared as it passes
      tl.fromTo(el, { opacity: 0, filter: "blur(9px)" }, { opacity: 1, duration: 0.5, ease: "power1.out" }, tIn);
      tl.to(el, { filter: "blur(0px)", duration: Math.max(0.2, tSharp - tIn - 0.1), ease: "power1.inOut" }, tIn + 0.1);
      tl.to(el, { filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, tOut - 0.3);
      tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, tOut);
    });
    // light portals between the cards: the camera flies through them
    const world = document.getElementById("trk-world");
    for (let i = 0; i < 10; i++) {
      const z = -(1010 + 620 * i);
      const p = document.createElement("div");
      p.className = "trk-portal";
      p.style.transform = `translate3d(0px, 0px, ${z}px) translate(-50%, -50%)`;
      world.appendChild(p);
      const tIn = Math.max(0, T0 + (-z - 3400) / V);
      const tOut = T0 + (-z + 300) / V;
      tl.fromTo(p, { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power1.out" }, tIn);
      tl.to(p, { opacity: 0, duration: 0.25, ease: "power1.in" }, tOut);
    }
    // speed lines radiating from the vanishing point
    (function () {
      const svg = document.getElementById("trk-speed");
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * Math.PI * 2 + (i % 3) * 0.05;
        const x2 = 540 + Math.cos(a) * 1500, y2 = 880 + Math.sin(a) * 1500;
        const x1 = 540 + Math.cos(a) * 90, y1 = 880 + Math.sin(a) * 90;
        svg.insertAdjacentHTML("beforeend", `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="stroke-dashoffset:${(i * 37) % 400}" />`);
      }
    })();
    // the camera flies forward, swaying like a body in motion
    tl.fromTo("#trk-world", { z: 0 }, { z: V * 8.2, duration: 8.2, ease: "none" }, T0);
    tl.fromTo("#trk-world", { rotationY: -5, rotationX: 3 }, { rotationY: 5, rotationX: -2, duration: 4.1, ease: "sine.inOut" }, T0);
    tl.to("#trk-world", { rotationY: -3, rotationX: 2, duration: 4.1, ease: "sine.inOut" }, T0 + 4.1);
    tl.fromTo("#trk-speed line", { strokeDashoffset: 0 }, { strokeDashoffset: -3200, duration: 8.6, ease: "none" }, 0);
    tl.fromTo("#trk-speed", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.3);
    tl.to("#trk-speed", { opacity: 0, duration: 0.5, ease: "power1.in" }, 8.3);

    tl.fromTo("#trk-chap-n", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.8);
    tl.fromTo("#trk-chap-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 0.9);
    tl.fromTo("#trk-chap-t", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 1.0);
    tl.fromTo(".trk-leg", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: "power3.out" }, 1.3);
    tl.to([".trk-chap", "#trk-legend"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.0);

    // the camera arrives: the last words come out of the depth and land
    tl.fromTo(
      "#trk-final .trk-fw",
      { opacity: 0, scale: 0.25, filter: "blur(12px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, stagger: 0.16, ease: "expo.out" },
      8.1,
    );
    tl.fromTo("#trk-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 8.65);
    // the full stop becomes the next world
    tl.to("#trk-final .trk-fw", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 9.75);
    tl.to("#trk-dot", { scale: 130, duration: 0.55, ease: "power3.in" }, 9.75);
    window.__timelines["tracks"] = tl;
  </script>
