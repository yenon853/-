<template>
  <style>
    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-400.ttf"); font-weight: 400; }
    @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-900.ttf"); font-weight: 900; }
    @font-face { font-family: "Frank Ruhl Libre"; src: url("assets/fonts/FrankRuhl-400.ttf"); font-weight: 400; }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse 90% 60% at 50% 46%, #12276a 0%, #071033 55%, #020613 100%);
      font-family: "Heebo", sans-serif;
    }
    .open-stars {
      position: absolute;
      left: -100px;
      top: -200px;
      width: 1280px;
      height: 2320px;
      transform-origin: 540px 1160px;
    }
    .open-star {
      position: absolute;
      border-radius: 50%;
      background: #cfefff;
    }
    #open-ringwrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      perspective: 1400px;
    }
    #open-ring3d {
      position: absolute;
      left: 40px;
      top: 470px;
      width: 1000px;
      height: 1000px;
      transform-style: preserve-3d;
    }
    #open-ring3d svg {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1000px;
      overflow: visible;
    }
    #open-ringpath {
      fill: none;
      stroke: url(#open-grad);
      stroke-width: 10;
      stroke-linecap: round;
    }
    #open-ringglow {
      fill: none;
      stroke: #00bcd4;
      stroke-width: 34;
      opacity: 0.35;
      filter: blur(16px);
    }
    #open-comet { fill: #f2fdff; }
    #open-cometglow { fill: #00bcd4; filter: blur(12px); }
    #open-shock {
      position: absolute;
      left: 290px;
      top: 720px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 6px solid #9ff6ff;
      opacity: 0;
    }
    #open-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #7ff3ff 30%, rgba(0, 188, 212, 0) 70%);
      mix-blend-mode: screen;
    }
    /* docu narration line */
    #open-narr {
      position: absolute;
      left: 80px;
      right: 80px;
      top: 560px;
      text-align: center;
      direction: rtl;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.9);
    }
    .open-m {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding: 0 4px;
    }
    .open-m > span {
      display: inline-block;
    }
    #open-big {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 760px;
      text-align: center;
      direction: rtl;
      font-size: 172px;
      font-weight: 900;
      line-height: 1.02;
      color: #ffffff;
      perspective: 900px;
    }
    .open-line {
      display: block;
      transform-style: preserve-3d;
    }
    .open-ch {
      display: inline-block;
      opacity: 0;
      /* extruded type: stacked shadows give the letters physical depth */
      text-shadow:
        0 3px 0 #b7c6e6, 0 6px 0 #8fa3cf, 0 9px 0 #6e84b8, 0 12px 0 #50679f,
        0 15px 0 #3a5189, 0 18px 0 #283f74, 0 24px 30px rgba(0, 0, 0, 0.55);
    }
    #open-l2 .open-ch {
      color: #00bcd4;
      text-shadow:
        0 3px 0 #00a2b8, 0 6px 0 #008ea2, 0 9px 0 #007a8c, 0 12px 0 #006777,
        0 15px 0 #005564, 0 18px 0 #004452, 0 24px 30px rgba(0, 0, 0, 0.55);
    }
  </style>
  <div id="root" data-composition-id="open" data-width="1080" data-height="1920">
    <div id="open-stars-far" class="open-stars" data-layout-ignore></div>
    <div id="open-stars-mid" class="open-stars" data-layout-ignore></div>
    <div id="open-stars-near" class="open-stars" data-layout-ignore></div>
    <div id="open-ringwrap" data-layout-ignore>
      <div id="open-ring3d">
        <svg viewBox="0 0 1000 1000">
          <defs>
            <linearGradient id="open-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1565c0" />
              <stop offset="0.6" stop-color="#00bcd4" />
              <stop offset="1" stop-color="#9ff6ff" />
            </linearGradient>
          </defs>
          <ellipse id="open-ringglow" cx="500" cy="500" rx="470" ry="470" />
          <path id="open-ringpath" d="M 970 500 A 470 470 0 1 1 30 500 A 470 470 0 1 1 970 500" />
          <circle id="open-cometglow" cx="0" cy="0" r="38" />
          <circle id="open-comet" cx="0" cy="0" r="15" />
        </svg>
      </div>
    </div>
    <div id="open-shock" data-layout-ignore></div>
    <div id="open-narr">
      <span class="open-m"><span>בראשון</span></span> <span class="open-m"><span>לציון,</span></span><br />
      <span class="open-m"><span>יש</span></span> <span class="open-m"><span>מקום</span></span> <span class="open-m"><span>אחד</span></span>
    </div>
    <div id="open-big" data-layout-allow-overflow>
      <span class="open-line" id="open-l1">שמצעיד</span>
      <span class="open-line" id="open-l2">את המחר.</span>
    </div>
    <div id="open-flash" data-layout-ignore></div>
  </div>
  <script>
    gsap.registerPlugin(MotionPathPlugin);
    (function () {
      let s = 1337;
      const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
      [["open-stars-far", 80, 1.6, 0.35], ["open-stars-mid", 50, 2.6, 0.55], ["open-stars-near", 26, 4, 0.85]].forEach(
        ([id, count, size, alpha]) => {
          const layer = document.getElementById(id);
          for (let i = 0; i < count; i++) {
            const d = document.createElement("div");
            d.className = "open-star";
            const sz = size * (0.6 + rnd() * 0.8);
            d.style.cssText = `left:${(rnd() * 1280).toFixed(1)}px;top:${(rnd() * 2320).toFixed(1)}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;opacity:${(alpha * (0.5 + rnd() * 0.5)).toFixed(2)}`;
            layer.appendChild(d);
          }
        },
      );
      ["open-l1", "open-l2"].forEach((id) => {
        const el = document.getElementById(id);
        const txt = el.textContent;
        el.textContent = "";
        for (const ch of txt) {
          const sp = document.createElement("span");
          sp.className = ch === " " ? "" : "open-ch";
          sp.textContent = ch === " " ? " " : ch;
          el.appendChild(sp);
        }
      });
    })();

    const tl = gsap.timeline({ paused: true });
    // frame one: a flash and the orbit bursts open — the hook
    tl.fromTo("#open-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0);
    tl.fromTo("#open-ring3d", { scale: 0.25, rotationX: 0, rotationZ: -40 }, { scale: 1, rotationX: 66, rotationZ: -22, duration: 1.1, ease: "expo.out" }, 0);
    tl.to("#open-ring3d", { rotationX: 62, rotationZ: -14, rotationY: 8, duration: 5.2, ease: "sine.inOut" }, 1.1);
    tl.fromTo("#open-shock", { scale: 0.3, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: 0.9, ease: "expo.out" }, 0);
    // stars arrive streaked (we were moving fast) and settle into a slow rise
    tl.fromTo(".open-stars", { scaleY: 7, opacity: 0.4 }, { scaleY: 1, opacity: 1, duration: 0.9, ease: "expo.out" }, 0);
    tl.fromTo("#open-stars-far", { y: 0 }, { y: -60, duration: 7.5, ease: "none" }, 0);
    tl.fromTo("#open-stars-mid", { y: 0 }, { y: -150, duration: 7.5, ease: "none" }, 0);
    tl.fromTo("#open-stars-near", { y: 0 }, { y: -320, duration: 7.5, ease: "none" }, 0);
    // the comet runs the orbit
    tl.fromTo(["#open-comet", "#open-cometglow"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.3);
    tl.to(
      ["#open-comet", "#open-cometglow"],
      {
        motionPath: { path: "#open-ringpath", align: "#open-ringpath", alignOrigin: [0.5, 0.5], start: 0.1, end: 1.9 },
        duration: 6.6,
        ease: "power1.inOut",
      },
      0.3,
    );
    // narration: each word rises out of its own slot
    tl.fromTo(
      "#open-narr .open-m > span",
      { yPercent: 110 },
      { yPercent: 0, duration: 0.5, stagger: 0.14, ease: "expo.out" },
      0.45,
    );
    // the claim: extruded letters fall onto the beat (96 BPM: 1.875 s, 2.5 s)
    tl.fromTo(
      "#open-l1 .open-ch",
      { opacity: 0, y: -260, rotationX: -80, filter: "blur(10px)" },
      { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.45, stagger: 0.05, ease: "back.out(2.1)" },
      1.6,
    );
    tl.fromTo(
      "#open-l2 .open-ch",
      { opacity: 0, y: -260, rotationX: -80, filter: "blur(10px)" },
      { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.45, stagger: 0.05, ease: "back.out(2.1)" },
      2.25,
    );
    // the camera drifts round the title: depth, not a slide
    tl.fromTo("#open-big", { rotationY: -10, rotationX: 6 }, { rotationY: 8, rotationX: -4, duration: 4.2, ease: "sine.inOut" }, 2.2);

    // zoom through the ring
    tl.to(["#open-big", "#open-narr"], { scale: 2.8, opacity: 0, filter: "blur(18px)", duration: 0.7, ease: "power3.in" }, 6.45);
    tl.to("#open-ring3d", { scale: 7, rotationX: 20, duration: 0.9, ease: "power3.in" }, 6.5);
    tl.to(".open-stars", { scale: 2.2, opacity: 0, duration: 0.8, ease: "power3.in" }, 6.55);
    window.__timelines["open"] = tl;
  </script>
</template>
