    (function () {
      // split the AI phrase into letters for the decode
      document.querySelectorAll(".rv-ai").forEach((ai) => {
        const txt = ai.textContent;
        ai.textContent = "";
        for (const ch of txt) {
          const s = document.createElement("span");
          s.className = "rv-d";
          s.textContent = ch;
          s.dataset.final = ch;
          ai.appendChild(s);
        }
      });

    const tl = gsap.timeline({ paused: true });
    // the machine layer: real source code of this film scrolls under everything
    tl.fromTo("#rv-code", { y: 60 }, { y: -980, duration: 10.4, ease: "none" }, 0);
    tl.fromTo("#rv-scan", { y: -300 }, { y: 1920, duration: 2.6, ease: "none" }, 0.4);
    tl.fromTo("#rv-scan", { y: -300 }, { y: 1920, duration: 2.6, ease: "none", immediateRender: false }, 6.0);

    // "רגע." lands hard with an RGB split that snaps together
    tl.set("#rv-wait", { opacity: 1 }, 0.45);
    tl.fromTo("#rv-gr", { x: -26, y: 6, opacity: 0.9 }, { x: 0, y: 0, opacity: 0, duration: 0.35, ease: "expo.out" }, 0.45);
    tl.fromTo("#rv-gc", { x: 24, y: -5, opacity: 0.9 }, { x: 0, y: 0, opacity: 0, duration: 0.35, ease: "expo.out" }, 0.45);
    tl.fromTo("#rv-wait", { scale: 1.12 }, { scale: 1, duration: 0.4, ease: "expo.out" }, 0.45);
    tl.to("#rv-wait", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 1.25);

    // rewind: the film's own frames rush back past the camera

    tl.fromTo("#rv-strip", { x: -1948, rotationY: -22 }, { x: 390, rotationY: 22, duration: 1.55, ease: "power2.inOut" }, 1.4);
    ["00:42", "00:36", "00:30", "00:24", "00:17", "00:11", "00:06", "00:00"].forEach((tc, i) => {
      tl.set("#rv-rewtc", { textContent: tc }, 1.4 + i * 0.19);
    });
    tl.to(["#rv-rew", "#rv-vhs", "#rv-rewlabel"], { opacity: 0, filter: "blur(10px)", duration: 0.15, ease: "power2.in" }, 2.95);

    tl.fromTo(
      "#rv-l1 .rv-w",

    tl.fromTo("#rv-l2 .rv-w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 3.6);
    // decode: each letter flickers through other letters before it settles
    (function () {
      let s = 99;
      const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
      const pool = "אבגדהוזחטיכלמנסעפצקרשת0101";
      document.querySelectorAll(".rv-ai .rv-d").forEach((el, i) => {
        const t0 = 3.75 + i * 0.045;
        tl.set(el, { opacity: 1, color: "#7ff3ff" }, t0);
        for (let k = 0; k < 6; k++) {
          tl.set(el, { textContent: pool[Math.floor(rnd() * pool.length)] }, t0 + k * 0.05);
        }
        tl.set(el, { textContent: el.dataset.final, color: "#00bcd4" }, t0 + 0.32);
      });
    })();
    tl.to("#rv-b2", { opacity: 0, filter: "blur(12px)", scale: 1.04, duration: 0.25, ease: "power2.in" }, 6.05);

    // what it took: crossed out, one by one
    [["#rv-no1", 6.3], ["#rv-no2", 6.75], ["#rv-no3", 7.2]].forEach(([id, t]) => {
      tl.fromTo(id, { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, t);
      tl.fromTo(id + " .rv-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, t + 0.35);
    });
    tl.to("#rv-b3", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 8.3);

    tl.fromTo(
