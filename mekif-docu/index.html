<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>

    <style>
      /* מקיף י' – צבעי בית הספר */
      :root {
        --navy: #0d1b4b;
        --blue: #1565c0;
        --teal: #00bcd4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #030817;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%);
      }
      #leak {
        position: absolute;
        inset: 0;
        z-index: 39;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      #leak-tex {
        position: absolute;
        left: -400px;
        top: -300px;
        width: 1880px;
        height: 2520px;
        background:
          radial-gradient(ellipse 40% 30% at 30% 30%, rgba(255, 214, 160, 0.9) 0%, rgba(255, 150, 90, 0) 70%),
          radial-gradient(ellipse 35% 45% at 70% 60%, rgba(0, 220, 255, 0.85) 0%, rgba(0, 188, 212, 0) 70%);
        opacity: 0;
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 41;
        pointer-events: none;
        overflow: hidden;
        mix-blend-mode: overlay;
        opacity: 0.16;
      }
      #grain-tex {
        position: absolute;
        left: -512px;
        top: -512px;
        width: 2104px;
        height: 2944px;
        background: url("assets/grain.png") repeat;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"

      <div id="place" class="clip scene" data-composition-id="place" data-composition-src="compositions/place.html"

      <div id="number" class="clip scene" data-composition-id="number" data-composition-src="compositions/number.html"

      <div id="endcard" class="clip scene" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="52.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="vignette" class="clip" data-start="0" data-duration="60" data-track-index="8" data-track-kind="graphics" data-layout-ignore></div>
      <div id="leak" class="clip" data-start="0" data-duration="60" data-track-index="7" data-track-kind="graphics" data-layout-ignore>

      <audio id="sfx-step5" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.55" data-duration="0.36" data-volume="0.55" data-track-index="22"></audio>
      <audio id="sfx-step6" class="clip" src="assets/sfx/pop.mp3" data-start="9.8" data-duration="0.72" data-volume="0.35" data-track-index="20"></audio>

      <audio id="sfx-impact98" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="19.95" data-duration="1.6" data-volume="0.45" data-fade-out="0.8" data-track-index="20"></audio>
      <audio id="sfx-warp" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="22.55" data-duration="3.4" data-volume="0.45" data-fade-out="0.6" data-track-index="21"></audio>
      <audio id="sfx-pass1" class="clip" src="assets/sfx/whoosh.mp3" data-start="26.25" data-duration="0.57" data-volume="0.25" data-track-index="22"></audio>

      <audio id="sfx-slam1" class="clip" src="assets/sfx/click.mp3" data-start="35.54" data-duration="0.36" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-slam2" class="clip" src="assets/sfx/click.mp3" data-start="35.69" data-duration="0.36" data-volume="0.55" data-track-index="22"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // film grain: the texture jumps to a new seeded offset every second frame
      (function () {
        let s = 2024;
        const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
        for (let f = 0; f < 900; f++) {
          tl.set("#grain-tex", { x: Math.round(rnd() * 512), y: Math.round(rnd() * 512) }, f / 15);
        }
      })();
      // light leaks on the hook and the two big entrances
      [[0, 0.85, 1.3], [35.0, 0.6, 1.0], [52.45, 0.5, 1.1]].forEach(([t, peak, d]) => {
        tl.fromTo("#leak-tex", { opacity: peak, x: -120, y: 0 }, { opacity: 0, x: 160, y: -80, duration: d, ease: "power2.out", immediateRender: false }, t);
      });
      tl.set("#leak-tex", { opacity: 0.85 }, 0);
      tl.to("#vignette", { opacity: 0.2, duration: 0.4, ease: "power1.inOut" }, 52.3);
      tl.to({}, { duration: 60 }, 0);
      window.__timelines["main"] = HyperShader.init({
        bgColor: "#030817",
        accentColor: "#00bcd4",
        scenes: ["open", "place", "number", "tracks", "alatz", "reveal", "endcard"],
        transitions: [
          { time: 7.2, shader: "cinematic-zoom", duration: 0.5 },
          { time: 17.2, shader: "gravitational-lens", duration: 0.6 },
          { time: 24.7, shader: "domain-warp", duration: 0.8 },
          { time: 35.0, duration: 0.03 },
          { time: 42.2, shader: "glitch", duration: 0.6 },
          { time: 52.5, duration: 0.03 },
        ],
        timeline: tl,
      });
    </script>
  </body>
</html>
