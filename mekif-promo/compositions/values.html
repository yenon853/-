  <script>
    const tl = gsap.timeline({ paused: true });
    // הטבעת ברקע מסתובבת לאט לאורך כל הסצנה

      "#values-orbit-g",
      { rotation: -6, svgOrigin: "180 1010" },
      { rotation: 18, svgOrigin: "180 1010", duration: 8.4, ease: "none" },

      { x: 1100, filter: "blur(18px)" },
      { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" },

      tl.fromTo(
        inSel,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" },
        at + 0.16,
      );
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 2.5, ease: "none" }, at + 0.16);
    };
    swap("#values-i1", "#values-i2", "#values-f2", 2.75);
    swap("#values-i2", "#values-i3", "#values-f3", 5.5);

    // חיתוך מוחשך לסצנה הבאה

    window.__timelines["values"] = tl;
