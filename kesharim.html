document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-size: 20px; font-weight: 600; color: #1AA3AC; letter-spacing: 0.1em;\">02<\u002Fspan>\n        <h2 style=\"margin: 0; flex: 1; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 30px; font-weight: 600;\">כתיבת שלושה משפטים עצמאיים<\u002Fh2>\n        <span style=\"background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 7px 18px; font-size: 17px; font-weight: 600;\">30 + 15 נקודות<\u002Fspan>\n        <span data-noprint=\"true\" style=\"font-size: 20px; color: #1AA3AC;\">{{ chev2 }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ open2 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 0 36px 32px; display: flex; flex-direction: column; gap: 20px;\">\n          <p style=\"margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #2c5257;\"><b style=\"font-weight: 600; color: #125B63;\">שלב א:<\u002Fb> כתבו שלושה משפטים נפרדים על הנושא שבחרתם.<\u002Fp>\n          <p style=\"margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #2c5257;\"><b style=\"font-weight: 600; color: #125B63;\">שלב ב:<\u002Fb> היכנסו לכלי בינה מלאכותית שנוח לכם וצרו תמונה המתארת כל משפט שכתבתם.<\u002Fp>\n          <div style=\"background: #FBE8F4; border-radius: 14px; padding: 16px 22px; font-size: 20px; font-weight: 600; color: #8C1D6B; line-height: 1.7;\">כתבו לבינה: \"צור לי תמונה הממחישה את המשפט הבא:\" והעתיקו את המשפט שכתבתם.<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #2c5257;\">את התמונה שקיבלתם העלו מתחת למשפט. כל תמונה שווה 5 נקודות. את הפרומפטים ותיעוד השיחה תצרפו בחלק 4.<\u002Fp>\n          <sc-for list=\"{{ sentenceRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 16px; align-items: flex-start; background: #fbfeff; border: 1px solid #d5ebee; border-radius: 18px; padding: 20px;\">\n              <div style=\"width: 48px; height: 48px; flex: 0 0 48px; border-radius: 999px; background font-size: 20px; font-weight: 600; color: #8C1D6B; line-height: 1.7;\">השתמשו בשתי מילות קישור המביעות קשר לוגי שונה זו מזו, למשל אחת של סיבה ואחת של ניגוד.<\u002Fdiv>\n          <div data-noprint=\"true\">\n            <button sc-camel-on-click=\"{{ openTable }}\" style=\"background: #8C1D6B; color: #fff; border: none; border-radius: 999px; padding: 13px 30px; font-family: 'Heebo', sans-serif; font-size: 19px; font-weight: 600; cursor: pointer;\" style-hover=\"opacity: 0.85;\">טבלת מילות קישור<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea value=\"{{ combined }}\" sc-camel-on-change=\"{{ onCombined }}\" rows=\"4\" placeholder=\"כתבו כאן את הפסקה המחוברת...\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #b9dde0; border-radius: 14px; padding: 16px 20px; font-family: 'Heebo', sans-serif; font-size: 20px; line-height: 1.8; color: #0B2E33; resize: vertical; outline: none; background: #fbfeff;\" style-focus=\"border-color: #1AA3AC;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border-radius: 24px; overflow: hidden;\">\n      <div sc-camel-on-click=\"{{ toggle4 }}\" style=\"display: flex; align-items: center; gap: 14px; padding: 26px 36px; cursor: pointer; flex-wrap: wrap;\" style-hover=\"background: #fbfeff;\">\n        <span style=\"font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #1AA3AC; letter-spacing: 0.1em;\">04<\u002Fspan>\n        <h2 style=\"margin: 0; flex: 1; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 30px; font-weight: 600;\">תמונה מסכמת ותיעוד השיחה<\u002Fh2>\n        <span style=\"background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 7px 18px; font-size: 17px; font-weight: 600;\">5 נקודות<\u002Fspan>\n        <span data-noprint=\"true\" style=\"font-size: 20px; color: #1AA3AC;\">{{ chev4 }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ open4 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 0 36px 32px; display: flex; flex-direction: column; gap: 16px;\">\n          <p style=\"margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #2c5257;\">בקשו מהבינה המלאכותית ליצור תמונה אחת שממחישה בצורה הטובה ביותר את הפסקה המחוברת שכתבתם. העלו כאן את התמונה שקיבלתם.<\u002Fp>\n          <sc-if value=\"{{ noFinalImage }}\" hint-placeholder-val=\"{{ true }}\">\n            <label data-noprint=\"true\" for=\"final-img-upload\" style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid #5FD4D7; border-radius: 16px; padding: 40px 20px; cursor: pointer; background: #fbfeff; text-align: center;\" style-hover=\"background: #E6F4F5;\">\n              <span style=\"font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #125B63;\">לחצו כאן כדי להעלות את התמונה מהמחשב<\u002Fspan>\n              <span style=\"font-size: 17px; font-weight: 300; color: #4a6f74;\">תמונה אחת שמחברת את כל שלושת המשפטים<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasFinalImage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center;\">\n              <div role=\"img\" aria-label=\"התמונה המסכמת\" style=\"{{ finalImgStyle }}\"><\u002Fdiv>\n              <div data-noprint=\"true\" style=\"display: flex; gap: 12px; align-items: center;\">\n                <label for=\"final-img-upload\" style=\"background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 9px 22px; font-size: 16px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #5FD4D7;\">החלפת תמונה<\u002Flabel>\n                <button sc-camel-on-click=\"{{ removeFinalImage }}\" style=\"background: transparent; color: #8C1D6B; border: none; font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;\">הסרה<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <input id=\"final-img-upload\" type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onFinalFile }}\" style=\"display: none;\">\n          <div style=\"background: #FBE8F4; border-radius: 14px; padding: 16px 22px; font-size: 20px; font-weight: 600; color: #8C1D6B; line-height: 1.7;\">תיעוד השיחה הוא חלק מההערכה: ניהול דו שיח עם הבינה, תיקון ודיוק התוצרים שהתקבלו יזכו בניקוד מלא.<\u002Fdiv>\n          <textarea value=\"{{ chatDoc }}\" sc-camel-on-change=\"{{ onChatDoc }}\" rows=\"5\" placeholder=\"העתיקו לכאן את השיחה המלאה שניהלתם עם הבינה: מה ביקשתם, מה קיבלתם, ואיך תיקנתם ודייקתם...\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #b9dde0; border-radius: 14px; padding: 16px 20px; font-family: 'Heebo', sans-serif; font-size: 19px; line-height: 1.8; color: #0B2E33; resize: vertical; outline: none; background: #fbfeff;\" style-focus=\"border-color: #1AA3AC;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border-radius: 24px; overflow: hidden;\">\n      <div sc-camel-on-click=\"{{ toggle5 }}\" style=\"display: flex; align-items: center; gap: 14px; padding: 26px 36px; cursor: pointer; flex-wrap: wrap;\" style-hover=\"background: #fbfeff;\">\n        <span style=\"font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #1AA3AC; letter-spacing: 0.1em;\">05<\u002Fspan>\n        <h2 style=\"margin: 0; flex: 1; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 30px; font-weight: 600;\">רפלקציה על התהליך<\u002Fh2>\n        <span style=\"background: #FBE8F4; color: #8C1D6B; border-radius: 999px; padding: 7px 18px; font-size: 17px; font-weight: 600;\">בונוס 5 נקודות, לא חובה<\u002Fspan>\n        <span data-noprint=\"true\" style=\"font-size: 20px; color: #1AA3AC;\">{{ chev5 }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ open5 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 0 36px 32px; display: flex; flex-direction: column; gap: 16px;\">\n          <p style=\"margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #2c5257;\"><b style=\"font-weight: 600; color: #125B63;\">איזה שלב בתהליך היה לכם מאתגר במיוחד? נסחו במילים שלכם ולמה.<\u002Fb><\u002Fp>\n          <textarea value=\"{{ reflection }}\" sc-camel-on-change=\"{{ onReflection }}\" rows=\"3\" placeholder=\"כתבו כאן את הרפלקציה שלכם...\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #b9dde0; border-radius: 14px; padding: 16px 20px; font-family: 'Heebo', sans-serif; font-size: 20px; line-height: 1.8; color: #0B2E33; resize: vertical; outline: none; background: #fbfeff;\" style-focus=\"border-color: #1AA3AC;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ allDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background: #1AA3AC; border-radius: 24px; padding: 24px 32px; text-align: center;\">\n        <span style=\"font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 600; color: #fff;\">כל הכבוד! סיימתם את כל השלבים. אפשר להראות למורה.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div data-noprint=\"true\" style=\"position: fixed; bottom: 28px; left: 28px; z-index: 90;\">\n      <button sc-camel-on-click=\"{{ printPage }}\" style=\"background: #1AA3AC; color: #fff; border: 2px solid #5FD4D7; border-radius: 999px; padding: 16px 36px; font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 600; cursor: pointer; animation: glowPulse 2s infinite;\" style-hover=\"background: #125B63;\">הורדה לקובץ הגשה<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ exampleOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; background: rgba(11,46,51,0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;\">\n        <div dir=\"rtl\" sc-camel-on-click=\"{{ stop }}\" style=\"background: #fff; border-radius: 20px; max-width: 620px; width: 100%; max-height: 82vh; overflow: auto; padding: 32px 36px; box-sizing: border-box; font-family: 'Heebo', sans-serif; color: #0B2E33;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px;\">\n            <h3 style=\"margin: 0; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 28px; font-weight: 600;\">עבודה לדוגמה<\u002Fh3>\n            <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background: #E6F4F5; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: #125B63;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin: 0 0 10px; font-size: 18px; font-weight: 600; color: #1AA3AC;\">הנושא: הבינה המלאכותית ושוק התעסוקה<\u002Fp>\n          <p style=\"margin: 0 0 8px; font-size: 17px; font-weight: 600; color: #125B63;\">שלושה משפטים עצמאיים, ולכל אחד תמונה מהבינה:<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"background: #E6F4F5; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 18px; line-height: 1.8; font-weight: 300;\">1. רבים חוששים כי הבינה המלאכותית תפגע בשוק התעסוקה הקיים.<\u002Fspan>\n              <img src=\"90028b18-4552-4d9e-bf56-b5b356cdaade\" alt=\"תמונה למשפט 1\" style=\"width: 100%; border-radius: 10px;\">\n            <\u002Fdiv>\n            <div style=\"background: #E6F4F5; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 18px; line-height: 1.8; font-weight: 300;\">2. בעידן הבינה המלאכותית נוצרים מקצועות חדשים שלא היו קיימים בעבר.<\u002Fspan>\n              <img src=\"4c0ce4d6-a73a-4813-b4ad-bf13db5df1c0\" alt=\"תמונה למשפט 2\" style=\"width: 100%; border-radius: 10px;\">\n            <\u002Fdiv>\n            <div style=\"background: #E6F4F5; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 18px; line-height: 1.8; font-weight: 300;\">3. בני אדם ומכונות יכולים לעבוד יחד ולהשיג תוצאות טובות יותר.<\u002Fspan>\n              <img src=\"5024c02f-e495-4b3c-8295-67564bf9a935\" alt=\"תמונה למשפט 3\" style=\"width: 100%; border-radius: 10px;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 16px 0 8px; font-size: 17px; font-weight: 600; color: #125B63;\">הפסקה המחוברת (שתי מילות קישור שונות):<\u002Fp>\n          <div style=\"background: #fbfeff; border: 1px solid #5FD4D7; border-radius: 14px; padding: 14px 18px; font-size: 18px; line-height: 1.9; font-weight: 300;\">רבים חוששים כי הבינה המלאכותית תפגע בשוק התעסוקה הקיים, <b style=\"color: #8C1D6B; font-weight: 800;\">אולם<\u002Fb> בעידן הבינה נוצרים מקצועות חדשים שלא היו קיימים בעבר. <b style=\"color: #8C1D6B; font-weight: 800;\">לכן<\u002Fb> כדאי ללמוד לעבוד יחד עם המכונות, כדי להשיג תוצאות טובות יותר.<\u002Fdiv>\n          <p style=\"margin: 16px 0 8px; font-size: 17px; font-weight: 600; color: #125B63;\">התמונה המסכמת לפסקה:<\u002Fp>\n          <img src=\"246022b6-844b-46f5-b2ad-a91ff1aaab0e\" alt=\"התמונה המסכמת\" style=\"width: 100%; border-radius: 10px;\">\n          <p style=\"margin: 16px 0 8px; font-size: 17px; font-weight: 600; color: #125B63;\">תיעוד שיחה לדוגמה (כך נראה דו שיח שמקבל את מלוא הנקודות):<\u002Fp>\n          <div style=\"border: 1px solid #d5ebee; border-radius: 16px; padding: 18px 20px; background: #fbfeff; display: flex; flex-direction: column; gap: 12px;\">\n            <span style=\"align-self: flex-start; background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 5px 16px; font-size: 15px; font-weight: 600;\">תמונה למשפט 1<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">צור לי תמונה הממחישה את המשפט הבא: רבים חוששים כי הבינה המלאכותית תפגע בשוק התעסוקה הקיים.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">יצרתי תמונה: אנשים מודאגים עומדים בתור מול משרד, ורובוט יושב בעמדת העבודה שלהם. ברקע שלט \"אין משרות\".<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">אני רוצה שהמסר של המשפט יותר יעבור מבחינה של להציג את שני הצדדים.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">עדכנתי: בצד אחד נשאר החשש והעננים האפורים, ובצד השני הוספתי שלט \"עתיד העבודה\" עם המילים חדשנות, יעילות וצמיחה. עכשיו התמונה מציגה את שני הצדדים.<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"align-self: flex-start; background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 5px 16px; font-size: 15px; font-weight: 600; margin-top: 6px;\">תמונה למשפט 2<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">צור לי תמונה הממחישה את המשפט הבא: בעידן הבינה המלאכותית נוצרים מקצועות חדשים שלא היו קיימים בעבר.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">יצרתי תמונה של משרד עתידני עם אנשים ורובוטים, אבל בלי שמות מקצועות.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">תוסיף בבקשה לוח עם שמות של מקצועות חדשים בעברית, למשל מאמן מודלי בינה, מנהלת אתיקה ורגולציית AI ומנתח נתונים. חשוב שהטקסט בעברית יהיה ברור ולא משובש.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">הוספתי לוח \"משרות חדשות בעידן ה-AI\" עם רשימת המקצועות בעברית ברורה, ולצדו אנשים עובדים במקצועות האלה.<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"align-self: flex-start; background: #E6F4F5; color: #125B63; border-radius: 999px; padding: 5px 16px; font-size: 15px; font-weight: 600; margin-top: 6px;\">תמונה למשפט 3<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">צור לי תמונה הממחישה את המשפט הבא: בני אדם ומכונות יכולים לעבוד יחד ולהשיג תוצאות טובות יותר.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">יצרתי תמונה של אדם ורובוט לוחצים ידיים על רקע לבן.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">זה כללי מדי. אני רוצה סביבת עבודה אמיתית: צוות של אנשים שעובד ליד רובוט באותו שולחן, עם מסכים, צמחייה ואווירה אופטימית של שיתוף פעולה.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">עדכנתי: משרד מואר עם צוות אנשים ורובוט שעובדים יחד סביב שולחן, מסכים שקופים, עציצים ועיר ירוקה ברקע.<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"align-self: flex-start; background: #FBE8F4; color: #8C1D6B; border-radius: 999px; padding: 5px 16px; font-size: 15px; font-weight: 600; margin-top: 6px;\">התמונה המסכמת לפסקה<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">עכשיו צור לי תמונה אחת הממחישה את הפסקה כולה: רבים חוששים כי הבינה המלאכותית תפגע בשוק התעסוקה הקיים, אבל בעידן הבינה נוצרים מקצועות חדשים שלא היו קיימים בעבר. לכן כדאי ללמוד לעבוד יחד עם המכונות, כדי להשיג תוצאות טובות יותר.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">יצרתי תמונה של אנשים סביב שולחן חכם עם נתונים.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1AA3AC;\">תלמיד:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">תדייק בבקשה: שהתמונה תרגיש ישראלית, עם קו רקיע של תל אביב בחלונות, ושיהיו בה גם צעירים וגם מבוגרים שלומדים טכנולוגיה חדשה יחד, באווירה של עתיד חיובי.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #8C1D6B;\">בינה:<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.8; font-weight: 300;\">עדכנתי: משרד מודרני עם נוף תל אביב, צוות מגוון עם משקפי מציאות מדומה ושולחן אינטראקטיבי, כולם לומדים ועובדים יחד. זו התמונה המסכמת שצורפה לעבודה.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top: 1px solid #d5ebee; padding-top: 10px; font-size: 16px; font-weight: 300; color: #4a6f74; line-height: 1.7;\">קישור למסמך השיחה המלאה צורף להגשה.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tableOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; background: rgba(11,46,51,0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;\">\n        <div dir=\"rtl\" sc-camel-on-click=\"{{ stop }}\" style=\"background: #fff; border-radius: 20px; max-width: 640px; width: 100%; max-height: 82vh; overflow: auto; padding: 32px 36px; box-sizing: border-box; font-family: 'Heebo', sans-serif; color: #0B2E33;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px;\">\n            <h3 style=\"margin: 0; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 28px; font-weight: 600;\">טבלת מילות קישור<\u002Fh3>\n            <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background: #E6F4F5; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: #125B63;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #d5ebee; border-radius: 16px; overflow: hidden;\">\n            <div style=\"display: grid; grid-template-columns: 150px 1fr; background: #0B2E33; padding: 14px 22px;\">\n              <span style=\"font-size: 18px; font-weight: 600; color: #5FD4D7;\">סוג הקשר<\u002Fspan>\n              <span style=\"font-size: 18px; font-weight: 600; color: #fff;\">מילות הקישור<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ connectorGroups }}\" as=\"grp\" hint-placeholder-count=\"5\">\n              <div style=\"display: grid; grid-template-columns: 150px 1fr; align-items: center; padding: 15px 22px; border-top: 1px solid #d5ebee; background: {{ grp.bg }};\">\n                <span style=\"font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #8C1D6B;\">{{ grp.name }}<\u002Fspan>\n                <span style=\"font-size: 20px; font-weight: 400; line-height: 1.7;\">{{ grp.words }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ gradeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; background: rgba(11,46,51,0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;\">\n        <div dir=\"rtl\" sc-camel-on-click=\"{{ stop }}\" style=\"background: #fff; border-radius: 20px; max-width: 680px; width: 100%; max-height: 86vh; overflow: auto; padding: 32px 36px; box-sizing: border-box; font-family: 'Heebo', sans-serif; color: #0B2E33;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px;\">\n            <h3 style=\"margin: 0; font-family: 'Fredoka', 'Varela Round', 'Heebo', sans-serif; font-size: 28px; font-weight: 600;\">הערכת הציון<\u002Fh3>\n            <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background: #E6F4F5; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: #125B63;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin: 0 0 10px; font-size: 19px; font-weight: 600; color: #125B63;\">חלוקת הניקוד:<\u002Fp>\n          <div style=\"border: 1px solid #d5ebee; border-radius: 16px; overflow: hidden; margin-bottom: 20px;\">\n            <sc-for list=\"{{ gradeRows }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: 1fr 110px; align-items: center; padding: 13px 22px; border-top: 1px solid #d5ebee; background: {{ g.bg }};\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <span style=\"font-size: 18px; font-weight: 600; line-height: 1.6;\">{{ g.label }}<\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 300; line-height: 1.6; color: #4a6f74;\">{{ g.desc }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #1AA3AC; text-align: center;\">{{ g.points }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display: grid; grid-template-columns: 1fr 110px; align-items: center; padding: 14px 22px; border-top: 1px solid #d5ebee; background: #E6F4F5;\">\n              <span style=\"font-size: 20px; font-weight: 600;\">סך הכול<\u002Fspan>\n              <span style=\"font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #125B63; text-align: center;\">100<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 110px; align-items: center; padding: 13px 22px; border-top: 1px solid #f0cde4; background: #FBE8F4;\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                <span style=\"font-size: 18px; font-weight: 600; color: #8C1D6B;\">רפלקציה, בונוס לא חובה<\u002Fspan>\n                <span style=\"font-size: 16px; font-weight: 300; line-height: 1.6; color: #8C1D6B;\">תשובה אישית ומנומקת על השלב המאתגר בתהליך.<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #8C1D6B; text-align: center;\">+5<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0 0 10px; font-size: 19px; font-weight: 600; color: #125B63;\">תנאי ההערכה:<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ gradeConditions }}\" as=\"cond\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; gap: 12px; align-items: flex-start; background: #fbfeff; border: 1px solid #d5ebee; border-radius: 12px; padding: 12px 18px;\">\n                <span style=\"color: #1AA3AC; font-size: 18px; font-weight: 600; margin-top: 2px;\">✓<\u002Fspan>\n                <span style=\"font-size: 18px; font-weight: 300; line-height: 1.7;\">{{ cond.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { topic: '', sentences: ['', '', ''], sentImages: [null, null, null], sentPrompts: ['', '', ''], sentPromptFixes: ['', '', ''], combined: '', finalImage: null, finalPrompt: '', finalPromptFix: '', chatDoc: '', reflection: '', modal: null, open: [true, true, true, true, true] };\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem('logical-connectors-task-v2') || 'null');\n      if (saved) this.setState({\n        topic: saved.topic || '', sentences: saved.sentences || ['', '', ''],\n        sentImages: saved.sentImages || [null, null, null],\n        sentPrompts: saved.sentPrompts || ['', '', ''],\n        sentPromptFixes: saved.sentPromptFixes || ['', '', ''],\n        combined: saved.combined || '', finalImage: saved.finalImage || null,\n        finalPrompt: saved.finalPrompt || '', finalPromptFix: saved.finalPromptFix || '',\n        chatDoc: saved.chatDoc || '', reflection: saved.reflection || ''\n      });\n    } catch (e) {}\n  }\n  save() {\n    const { topic, sentences, sentImages, sentPrompts, sentPromptFixes, combined, finalImage, finalPrompt, finalPromptFix, chatDoc, reflection } = this.state;\n    try { localStorage.setItem('logical-connectors-task-v2', JSON.stringify({ topic, sentences, sentImages, sentPrompts, sentPromptFixes, combined, finalImage, finalPrompt, finalPromptFix, chatDoc, reflection })); } catch (e) {}\n  }\n  set(patch) { this.setState(patch, () => this.save()); }\n  toggle(i) { const o = this.state.open.slice(); o[i] = !o[i]; this.setState({ open: o }); }\n  setArr(key, i, val) { const a = this.state[key].slice(); a[i] = val; this.set({ [key]: a }); }\n  readImage(e, cb) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const max = 800, scale = Math.min(1, max / Math.max(img.width, img.height));\n        const c = document.createElement('canvas');\n        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);\n        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n        cb(c.toDataURL('image/jpeg', 0.8));\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n    e.target.value = '';\n  }\n  renderVals() {\n    const s = this.state, open = s.open;\n    const sentenceRows = s.sentences.map((v, i) => ({\n      num: i + 1, value: v,\n      imgStyle: { width: '100%', height: 280, borderRadius: 14, backgroundSize: 'contain', backgroundRepeat: 'no-repeat', backgroundPosition: 'center', backgroundImage: s.sentImages[i] ? 'url(\"' + s.sentImages[i] + '\")' : 'none' },\n      hasImage: !!s.sentImages[i], noImage: !s.sentImages[i],\n      inputId: 'sent-img-' + i,\n      onChange: (e) => this.setArr('sentences', i, e.target.value),\n      onFile: (e) => this.readImage(e, (data) => this.setArr('sentImages', i, data)),\n      removeImage: () => this.setArr('sentImages', i, null)\n    }));\n    const topicIdeas = ['החופש הגדול', 'חיית המחמד שלי', 'המשחק האהוב עליי', 'טיול עם המשפחה'].map(label => ({\n      label, pick: () => this.set({ topic: label })\n    }));\n    const steps = [\n      s.topic.trim().length > 0,\n      s.sentences.every(x => x.trim().length > 0) && s.sentImages.every(im => !!im),\n      s.combined.trim().length > 0,\n      !!s.finalImage\n    ];\n    const done = steps.filter(Boolean).length;\n    return {\n      topic: s.topic,\n      onTopic: (e) => this.set({ topic: e.target.value }),\n      sentenceRows, topicIdeas,\n      combined: s.combined,\n      onCombined: (e) => this.set({ combined: e.target.value }),\n      finalImgStyle: { width: '100%', height: 380, borderRadius: 16, backgroundSize: 'contain', backgroundRepeat: 'no-repeat', backgroundPosition: 'center', backgroundImage: s.finalImage ? 'url(\"' + s.finalImage + '\")' : 'none' },\n      hasFinalImage: !!s.finalImage, noFinalImage: !s.finalImage,\n      onFinalFile: (e) => this.readImage(e, (data) => this.set({ finalImage: data })),\n      removeFinalImage: () => this.set({ finalImage: null }),\n      finalPrompt: s.finalPrompt,\n      onFinalPrompt: (e) => this.set({ finalPrompt: e.target.value }),\n      finalPromptFix: s.finalPromptFix,\n      onFinalPromptFix: (e) => this.set({ finalPromptFix: e.target.value }),\n      chatDoc: s.chatDoc,\n      onChatDoc: (e) => this.set({ chatDoc: e.target.value }),\n      reflection: s.reflection,\n      onReflection: (e) => this.set({ reflection: e.target.value }),\n      open1: open[0], open2: open[1], open3: open[2], open4: open[3], open5: open[4],\n      chev1: open[0] ? '▲' : '▼', chev2: open[1] ? '▲' : '▼', chev3: open[2] ? '▲' : '▼', chev4: open[3] ? '▲' : '▼', chev5: open[4] ? '▲' : '▼',\n      toggle1: () => this.toggle(0), toggle2: () => this.toggle(1), toggle3: () => this.toggle(2), toggle4: () => this.toggle(3), toggle5: () => this.toggle(4),\n      progressText: done + '/4 שלבים הושלמו',\n      allDone: done === 4,\n      printPage: () => {\n        this.setState({ open: [true, true, true, true, true], modal: null }, () => {\n          const old = document.title;\n          document.title = s.topic.trim() || 'כותבים - יוצרים - מקשרים';\n          setTimeout(() => {\n            window.print();\n            setTimeout(() => { document.title = old; }, 1000);\n          }, 150);\n        });\n      },\n      openExample: () => this.setState({ modal: 'example' }),\n      openTable: () => this.setState({ modal: 'table' }),\n      openGrade: () => this.setState({ modal: 'grade' }),\n      closeModal: () => this.setState({ modal: null }),\n      stop: (e) => e.stopPropagation(),\n      exampleOpen: s.modal === 'example',\n      tableOpen: s.modal === 'table',\n      gradeOpen: s.modal === 'grade',\n      connectorGroups: [\n        { name: 'הוספה', words: 'וגם, בנוסף, כמו כן', bg: '#fff' },\n        { name: 'סיבה', words: 'כי, מפני ש־, משום ש־', bg: '#fbfeff' },\n        { name: 'תוצאה', words: 'לכן, לפיכך, כתוצאה מכך', bg: '#fff' },\n        { name: 'ניגוד', words: 'אבל, אולם, לעומת זאת', bg: '#fbfeff' },\n        { name: 'זמן', words: 'כאשר, לפני ש־, אחרי ש־', bg: '#fff' },\n        { name: 'ויתור', words: 'אף על פי ש־, למרות ה־', bg: '#fbfeff' },\n        { name: 'תנאי', words: 'אם, לו, במידה ש־', bg: '#fff' }\n      ],\n      gradeRows: [\n        { label: 'בחירת נושא', desc: 'נושא אחד ברור שמתאים לכתיבת שלושה משפטים עליו.', points: '10', bg: '#fff' },\n        { label: 'כתיבת שלושה משפטים', desc: 'המשפטים עצמאיים, תקינים בלשונם וקשורים לנושא (10 נקודות לכל משפט).', points: '30', bg: '#fbfeff' },\n        { label: 'יצירת ארבע תמונות', desc: 'שלוש תמונות למשפטים ותמונה מסכמת אחת לפסקה, 5 נקודות לכל תמונה. כולל פרומפטים ותיעוד השיחה בחלק 4.', points: '20', bg: '#fff' },\n        { label: 'חיבור המשפטים לפסקה בעזרת מילות קישור', desc: 'פסקה רציפה ותקינה עם שתי מילות קישור המביעות קשר לוגי שונה זו מזו.', points: '40', bg: '#fbfeff' }\n      ],\n      gradeConditions: [\n        { text: 'הוגשו ארבע תמונות: שלוש תמונות למשפטים ותמונה מסכמת אחת לפסקה.' },\n        { text: 'כל תמונה מעבירה באופן ברור את הרעיון של המשפט או הפסקה.' },\n        { text: 'אם מופיע טקסט בתמונה, הוא ברור, תקין ואינו משובש.' },\n        { text: 'לכל תמונה צורף הפרומפט המלא ששימש ליצירתה.' },\n        { text: 'אם נעשה שימוש בפרומפט נוסף כדי לדייק או לתקן את התמונה, צורף גם הפרומפט המתוקן.' },\n        { text: 'ניהול דו שיח עם הבינה, תיקון ודיוק התוצרים שהתקבלו יזכו בניקוד מלא על תיעוד השיחה.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
