<template>
  <style>
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Varela Round'; src: url('assets/fonts/varela-round-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Varela Round'; src: url('assets/fonts/varela-round-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    #hook-all { position: absolute; inset: 0; }
    #hook-q { position: absolute; left: 0; right: 0; top: 150px; direction: rtl; text-align: center; font-family: 'Suez One', serif; font-size: 104px; line-height: 1.2; color: #0B2E33; }
    #hook-q .w { display: inline-block; margin: 0 0.12em; }
    #hook-q .acc { color: #D6339B; }
    #hook-sent { position: absolute; left: 0; right: 0; top: 410px; direction: rtl; display: flex; justify-content: center; align-items: flex-start; gap: 28px; }
    .hk-grp { position: relative; display: flex; flex-direction: column; align-items: center; }
    .hk-words { position: relative; font-family: 'Suez One', serif; font-size: 82px; line-height: 1.3; color: #0B2E33; white-space: nowrap; padding: 0 14px; }
    .hk-words .w { display: inline-block; margin: 0 0.1em; position: relative; z-index: 1; }
    .hk-hl { position: absolute; left: 0; right: 0; top: 14%; bottom: 8%; border-radius: 18px; z-index: 0; }
    #hook-g1 .hk-hl { background: #CDEEF1; }
    #hook-g2 .hk-hl { background: #FBD0E8; }
    #hook-g3 .hk-hl { background: #EEF3F3; }
    .hk-bar { width: 100%; height: 8px; border-radius: 4px; margin-top: 10px; }
    #hook-g1 .hk-bar { background: #1AA3AC; }
    #hook-g2 .hk-bar { background: #D6339B; }
    #hook-g3 .hk-bar { background: #B9CACC; }
    .hk-chip { margin-top: 22px; padding: 8px 30px 12px; border-radius: 999px; font-family: 'Suez One', serif; font-size: 50px; color: #FFFFFF; }
    #hook-g1 .hk-chip { background: #1AA3AC; }
    #hook-g2 .hk-chip { background: #D6339B; }
    #hook-g3 .hk-chip { background: #8FA7AA; }
    .hk-hint { margin-top: 14px; font-family: 'Varela Round', sans-serif; font-size: 38px; color: #3E5F63; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <div id="hook-all">
      <div id="hook-q"><span class="w" id="hook-q1">איך מלמדים</span><span class="w" id="hook-q2">תחביר</span><span class="w acc" id="hook-q3">אחרת?</span></div>
      <div id="hook-sent">
        <div class="hk-grp" id="hook-g1">
          <div class="hk-words"><div class="hk-hl"></div><span class="w">הנהלת</span><span class="w">בית</span><span class="w">הספר</span></div>
          <div class="hk-bar"></div><div class="hk-chip">נושא</div><div class="hk-hint">מי ביצע את הפעולה?</div>
        </div>
        <div class="hk-grp" id="hook-g2">
          <div class="hk-words"><div class="hk-hl"></div><span class="w">אישרה</span></div>
          <div class="hk-bar"></div><div class="hk-chip">נשוּא</div><div class="hk-hint">הפועל שבמשפט</div>
        </div>
        <div class="hk-grp" id="hook-g3">
          <div class="hk-words"><div class="hk-hl"></div><span class="w">את</span><span class="w">התוכנית</span><span class="w">החדשה</span></div>
          <div class="hk-bar"></div><div class="hk-chip">תוספות</div><div class="hk-hint">כל השאר</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, at, d = 0.13) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, at);
    // The question: its first words are there on frame 0
    blurIn("#hook-q2", 0.25); blurIn("#hook-q3", 0.42);
    tl.to("#hook-q", { y: -60, scale: 0.72, duration: 0.5, ease: "power3.inOut", transformOrigin: "50% 0%" }, 1.15);

    // The sentence pops in word by word
    const words = gsap.utils.toArray("#hook-sent .w");
    tl.set(".hk-bar, .hk-chip, .hk-hint", { opacity: 0 }, 0);
    tl.set(".hk-hl", { scaleX: 0, transformOrigin: "100% 50%" }, 0);
    words.forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, scale: 0.55, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, 1.35 + i * 0.09);
    });

    // Live labelling, the lomda's own scaffolds: נשוא first, then נושא, then the rest
    const label = (g, at) => {
      tl.to(`${g} .hk-hl`, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at);
      tl.fromTo(`${g} .hk-bar`, { opacity: 1, scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at + 0.05);
      tl.fromTo(`${g} .hk-chip`, { opacity: 0, scale: 0.4, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, at + 0.2);
      tl.fromTo(`${g} .hk-hint`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at + 0.42);
    };
    label("#hook-g2", 2.45);
    label("#hook-g1", 3.35);
    tl.to("#hook-g3 .hk-words", { color: "#9DB3B6", duration: 0.3, ease: "power2.inOut" }, 4.2);
    label("#hook-g3", 4.25);

    // Whip out to the left
    tl.to("#hook-all", { x: -900, opacity: 0, filter: "blur(18px)", duration: 0.36, ease: "power3.in" }, 5.84);
    window.__timelines["hook"] = tl;
  </script>
</template>
