<template>
  <style>
    #root { position: absolute; inset: 0; background: #F4FAFA; overflow: hidden; }
    #choose-cam { position: absolute; left: 0; top: 0; width: 3200px; height: 1800px; }
    #choose-cam img { position: absolute; left: 0; top: 0; width: 3200px; height: 1800px; }
    #choose-cursor { position: absolute; left: 0; top: 0; width: 48px; height: 68px; }
  </style>
  <div id="root" data-composition-id="choose" data-width="1920" data-height="1080" data-layout-allow-overflow>
    <div id="choose-cam" data-layout-ignore>
      <img id="choose-a" src="assets/ui/choice.png" alt="איך תרצו להתחיל?" />
      <img id="choose-b" src="assets/ui/choice-hover.png" alt="" />
    </div>
    <div id="choose-cursor" data-layout-ignore>
      <svg width="48" height="68" viewBox="0 0 24 34"><path d="M2 2 L2 27 L8.5 21 L12.5 31 L16.5 29.3 L12.6 19.6 L21 19.6 Z" fill="#FFFFFF" stroke="#0B2E33" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <script>
    const cam = (cx, cy, z) => ({ x: 960 - z * cx, y: 540 - z * cy, scale: z / 2 });
    const pt = (c, px, py) => ({ x: c.x + c.scale * 2 * px - 4, y: c.y + c.scale * 2 * py - 4 });
    const tl = gsap.timeline({ paused: true });
    const full = cam(800, 450, 1.2), pane = cam(807, 502, 1.6), through = cam(537, 560, 6);
    tl.fromTo("#choose-cam", { ...full, transformOrigin: "0 0", filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 0);
    tl.fromTo("#choose-b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.to("#choose-cam", { ...pane, duration: 0.5, ease: "power2.inOut" }, 0.2);
    // The cursor picks "מתחילים ביחידה"
    const card = pt(pane, 537, 560);
    tl.fromTo("#choose-cursor", { x: 1960, y: 1140 }, { x: card.x, y: card.y, duration: 0.8, ease: "power3.out" }, 0.55);
    tl.set("#choose-b", { opacity: 1 }, 1.3);
    tl.to("#choose-cursor", { scale: 0.85, duration: 0.06, ease: "power2.in", transformOrigin: "4px 4px" }, 1.54);
    tl.to("#choose-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 1.6);
    // Zoom through the card into the unit
    tl.to("#choose-cursor", { opacity: 0, duration: 0.12 }, 1.75);
    tl.to("#choose-cam", { ...through, filter: "blur(14px)", duration: 0.45, ease: "power3.in" }, 1.75);
    window.__timelines["choose"] = tl;
  </script>
</template>
