<template>
  <style>
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Varela Round'; src: url('assets/fonts/varela-round-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }

    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    .win { position: absolute; background: #FFFFFF; border-radius: 22px; box-shadow: 0 30px 70px rgba(11,46,51,.18); overflow: hidden; }
    .win-bar { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: #FFFFFF; border-bottom: 1px solid #D7E8EA; }

    .cam img { position: absolute; left: 0; top: 0; width: 3200px; height: 1800px; }

  </style>
  <div id="root" data-composition-id="choose" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div class="win" id="ch-win" data-layout-ignore>
      <div class="win-bar"><i style="right:20px;background:#D6339B"></i><i style="right:40px;background:#F0A63C"></i><i style="right:60px;background:#5FD4D7"></i></div>
      <div class="win-view">

        <div class="cursor" id="ch-cursor"><svg width="48" height="68" viewBox="0 0 24 34"><path d="M2 2 L2 27 L8.5 21 L12.5 31 L16.5 29.3 L12.6 19.6 L21 19.6 Z" fill="#FFFFFF" stroke="#0B2E33" stroke-width="2" stroke-linejoin="round"/></svg></div>

  <script>
    // Camera inside a window view of size W x H over a 2x capture
    const W = 940, H = 520;
    const cam = (cx, cy, z) => ({ x: W / 2 - z * cx, y: H / 2 - z * cy, scale: z / 2 });
    const pt = (c, px, py) => ({ x: c.x + c.scale * 2 * px - 4, y: c.y + c.scale * 2 * py - 4 });
    const tl = gsap.timeline({ paused: true });
    const view = cam(537, 575, 1.75);
    tl.set("#ch-cam", { ...view, transformOrigin: "0 0" }, 0);
    tl.fromTo("#ch-win", { x: -260, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
    gsap.utils.toArray("#ch-title .w").forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 0.3 + i * 0.1);
    });
    tl.fromTo("#ch-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.8);
    // The cursor picks "מתחילים ביחידה"
    const card = pt(view, 537, 560);
    tl.fromTo("#ch-cursor", { x: W + 40, y: H + 60 }, { x: card.x, y: card.y, duration: 0.6, ease: "power3.out" }, 1.3);
    tl.set("#ch-b", { opacity: 1 }, 1.85);
    tl.to("#ch-cursor", { scale: 0.85, duration: 0.06, ease: "power2.in", transformOrigin: "4px 4px" }, 2.24);
    tl.to("#ch-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 2.3);
    tl.to("#ch-cursor", { opacity: 0, duration: 0.15 }, 2.8);
    // Zoom through the window into the unit
    tl.to(["#ch-title", "#ch-sub"], { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 3.55);
    tl.to("#ch-win", { scale: 3.2, x: 380, filter: "blur(14px)", duration: 0.5, ease: "power3.in", transformOrigin: "50% 55%" }, 3.7);
    window.__timelines["choose"] = tl;
  </script>
