  <script>
    const cam = (cx, cy, z) => ({ x: 960 - z * cx, y: 540 - z * cy, scale: z / 2 });
    const pt = (c, px, py) => ({ x: c.x + c.scale * 2 * px - 4, y: c.y + c.scale * 2 * py - 4 });
    const tl = gsap.timeline({ paused: true });
    const pane = cam(807, 470, 1.6);
    // Whip in from the right, landing blurred and sharpening
    tl.fromTo("#game-cam", { ...pane, x: pane.x + 700, transformOrigin: "0 0", filter: "blur(20px)" }, { x: pane.x, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0);

    // "אוגד"
    const btn = pt(pane, 1030, 567);
    tl.fromTo("#game-cursor", { x: 1960, y: 1140 }, { x: btn.x, y: btn.y, duration: 0.6, ease: "power3.out" }, 0.45);

    tl.to("#game-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 1.15);
    tl.set("#game-b", { opacity: 1 }, 1.17);
    tl.to("#game-cursor", { opacity: 0, duration: 0.2 }, 1.45);
    window.__timelines["game"] = tl;
  </script>
