<template>
  <style>
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Suez One'; src: url('assets/fonts/suez-one-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Varela Round'; src: url('assets/fonts/varela-round-hebrew.woff2') format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Varela Round'; src: url('assets/fonts/varela-round-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
    #root { position: absolute; inset: 0; background: #E6F4F5; overflow: hidden; }
    #mk-all { position: absolute; inset: 0; }
    .win { position: absolute; background: #FFFFFF; border-radius: 22px; box-shadow: 0 30px 70px rgba(11,46,51,.16); overflow: hidden; }
    .win-bar { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: #FFFFFF; border-bottom: 1px solid #D7E8EA; }
    .win-bar i { position: absolute; top: 12px; width: 12px; height: 12px; border-radius: 6px; }
    .win-view { position: absolute; left: 0; right: 0; top: 36px; bottom: 0; overflow: hidden; background: #F4FAFA; }
    .cam { position: absolute; left: 0; top: 0; width: 3200px; height: 1800px; }
    .cam img { position: absolute; left: 0; top: 0; width: 3200px; height: 1800px; }
    #mk-s1, #mk-s2, #mk-s3, #mk-s4, #mk-s5 { opacity: 0; }
    .cursor { position: absolute; left: 0; top: 0; width: 48px; height: 68px; }
    #mk-win { left: 160px; top: 318px; width: 1600px; height: 696px; }
    #mk-title { position: absolute; left: 0; right: 0; top: 46px; direction: rtl; text-align: center; font-family: 'Suez One', serif; font-size: 96px; line-height: 1.2; color: #0B2E33; }
    #mk-title .w { display: inline-block; margin: 0 0.12em; }
    #mk-title .acc { color: #D6339B; }
    #mk-sub { position: absolute; left: 0; right: 0; top: 182px; direction: rtl; text-align: center; font-family: 'Varela Round', sans-serif; font-size: 42px; color: #3E5F63; }
    .callout { position: absolute; direction: rtl; display: flex; align-items: center; gap: 14px; padding: 14px 30px 16px; border-radius: 999px; font-family: 'Suez One', serif; font-size: 46px; color: #FFFFFF; box-shadow: 0 14px 30px rgba(11,46,51,.18); white-space: nowrap; }
    #mk-call { right: 110px; top: 278px; background: #1f8f6a; }
  </style>
  <div id="root" data-composition-id="mark" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="mk-all">
      <div id="mk-title"><span class="w">סמנו</span><span class="w acc">בעצמכם</span></div>
      <div id="mk-sub">התלמידים מסמנים נושא ונשוּא, והלומדה בודקת</div>
      <div class="win" id="mk-win" data-layout-ignore>
        <div class="win-bar"><i style="right:20px;background:#D6339B"></i><i style="right:40px;background:#F0A63C"></i><i style="right:60px;background:#5FD4D7"></i></div>
        <div class="win-view">
          <div class="cam" id="mk-cam">
            <img id="mk-s0" src="assets/ui/mark-0.png" alt="סמנו בעצמכם: הנהלת בית הספר אישרה את התוכנית החדשה בתחילת השנה" />
            <img id="mk-s1" src="assets/ui/mark-1.png" alt="" />
            <img id="mk-s2" src="assets/ui/mark-2.png" alt="" />
            <img id="mk-s3" src="assets/ui/mark-3.png" alt="" />
            <img id="mk-s4" src="assets/ui/mark-4.png" alt="" />
            <img id="mk-s5" src="assets/ui/mark-5.png" alt="" />
          </div>
          <div class="cursor" id="mk-cursor"><svg width="48" height="68" viewBox="0 0 24 34"><path d="M2 2 L2 27 L8.5 21 L12.5 31 L16.5 29.3 L12.6 19.6 L21 19.6 Z" fill="#FFFFFF" stroke="#0B2E33" stroke-width="2" stroke-linejoin="round"/></svg></div>
        </div>
      </div>
      <div class="callout" id="mk-call"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#FFFFFF"/><path d="M11 21 L17.5 27.5 L29.5 14" fill="none" stroke="#1f8f6a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>משוב מיידי</div>
    </div>
  </div>
  <script>
    const W = 1600, H = 660;
    const cam = (cx, cy, z) => ({ x: W / 2 - z * cx, y: H / 2 - z * cy, scale: z / 2 });
    const pt = (c, px, py) => ({ x: c.x + c.scale * 2 * px - 4, y: c.y + c.scale * 2 * py - 4 });
    const tl = gsap.timeline({ paused: true });
    const view = cam(807, 470, 1.5);
    tl.set("#mk-cam", { ...view, transformOrigin: "0 0" }, 0);
    // Arrives from the zoom-through slightly large and blurred, then settles
    tl.fromTo("#mk-win", { scale: 1.25, filter: "blur(12px)", transformOrigin: "50% 50%" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
    gsap.utils.toArray("#mk-title .w").forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 0.3 + i * 0.1);
    });
    tl.fromTo("#mk-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.65);

    // Five real clicks on the spine sentence, each showing the lomda's own next state
    const steps = [
      { p: [978, 588], at: 1.6, img: "#mk-s1" },  // סימון נשוּא
      { p: [919, 506], at: 2.35, img: "#mk-s2" }, // אישרה
      { p: [842, 588], at: 3.1, img: "#mk-s3" },  // סימון נושא
      { p: [1083, 506], at: 3.85, img: "#mk-s4" }, // הנהלת בית הספר
      { p: [720, 588], at: 4.6, img: "#mk-s5" },  // בדיקה
    ];
    let from = { x: W + 40, y: H + 60 };
    tl.set("#mk-cursor", from, 0);
    steps.forEach((s, i) => {
      const to = pt(view, s.p[0], s.p[1]);
      const travel = i === 0 ? 0.6 : 0.42;
      tl.fromTo("#mk-cursor", { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: travel, ease: "power3.out", immediateRender: false }, s.at - travel - 0.08);
      tl.to("#mk-cursor", { scale: 0.85, duration: 0.06, ease: "power2.in", transformOrigin: "4px 4px" }, s.at - 0.06);
      tl.to("#mk-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, s.at);
      tl.to(s.img, { opacity: 1, duration: 0.1, ease: "none" }, s.at + 0.02);
      from = to;
    });
    tl.to("#mk-cursor", { opacity: 0, duration: 0.15 }, 4.85);
    tl.fromTo("#mk-call", { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 4.9);
    // Whip out to the next feature
    tl.to("#mk-all", { x: -900, opacity: 0, filter: "blur(18px)", duration: 0.34, ease: "power3.in" }, 7.26);
    window.__timelines["mark"] = tl;
  </script>
</template>
