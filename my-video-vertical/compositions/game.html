  <script>
    const tl = gsap.timeline({ paused: true });
    const drawCircuit = (sel, at) => {
      gsap.utils.toArray(`${sel} .cp`).forEach((p, i) => {
        const L = p.getTotalLength();
        tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at + i * 0.07);
      });
      gsap.utils.toArray(`${sel} .cd`).forEach((d, i) => {
        tl.fromTo(d, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at + 0.5 + i * 0.07);
      });
    };
    const tap = (sel, x, y, at, show = 0.35) => {
      tl.fromTo(sel, { x, y, opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: show, ease: "power3.out", immediateRender: false }, at - show - 0.05);
      tl.to(sel, { scale: 0.72, duration: 0.07, ease: "power2.in" }, at - 0.05);
      tl.to(sel, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.02);
    };
    const moveTap = (sel, x, y, at, d = 0.38) => {
      tl.to(sel, { x, y, duration: d, ease: "power3.inOut" }, at - d - 0.06);
      tl.to(sel, { scale: 0.72, duration: 0.07, ease: "power2.in" }, at - 0.05);
      tl.to(sel, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.02);
    };
    drawCircuit("#gm-circ", 0.15);
    gsap.utils.toArray("#gm-t .w").forEach((w, i) => {
      tl.fromTo(w, { scale: 0, rotation: i % 2 ? 20 : -20 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 0.05 + i * 0.12);
    });
    // Whip in, tilted, and land
    tl.fromTo("#gm-card", { x: 1100, rotation: 12, filter: "blur(16px)" }, { x: 0, rotation: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.2)" }, 0.15);
