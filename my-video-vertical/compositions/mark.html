  <script>
    const tl = gsap.timeline({ paused: true });
    const drawCircuit = (sel, at) => {
      gsap.utils.toArray(`${sel} .cp`).forEach((p, i) => {
        const L = p.getTotalLength();
        tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at + i * 0.07);
      });
      gsap.utils.toArray(`${sel} .cd`).forEach((d, i) => {
        tl.fromTo(d, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at + 0.5 + i * 0.07);
      });
    };
    const tap = (sel, x, y, at, show = 0.35) => {
      tl.fromTo(sel, { x, y, opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: show, ease: "power3.out", immediateRender: false }, at - show - 0.05);
      tl.to(sel, { scale: 0.72, duration: 0.07, ease: "power2.in" }, at - 0.05);
      tl.to(sel, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.02);
    };
    const moveTap = (sel, x, y, at, d = 0.38) => {
      tl.to(sel, { x, y, duration: d, ease: "power3.inOut" }, at - d - 0.06);
      tl.to(sel, { scale: 0.72, duration: 0.07, ease: "power2.in" }, at - 0.05);
      tl.to(sel, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.02);
    };
    // Golden-angle spread so the burst is the same on every render
    const burst = (sel, x, y, at, spread = 520) => {
      gsap.utils.toArray(`${sel} .cf`).forEach((p, i) => {
        const a = i * 2.39996, r = spread * (0.45 + ((i * 37) % 11) / 20);
        const dx = Math.cos(a) * r, dy = Math.sin(a) * r * 0.7 - 160;
        tl.fromTo(p, { x, y, opacity: 1, rotation: 0, scale: 0.4 }, { x: x + dx, y: y + dy, rotation: (i % 2 ? 1 : -1) * (200 + i * 23), scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, at);
        tl.to(p, { y: y + dy + 420, opacity: 0, duration: 0.9, ease: "power2.in" }, at + 0.7);
      });
    };
    drawCircuit("#mk-circ", 0.2);
    // Arrives out of the tapped card, large and blurred, then settles
    tl.fromTo("#mk-card", { scale: 1.5, filter: "blur(14px)", transformOrigin: "50% 50%" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
    gsap.utils.toArray("#mk-t .w").forEach((w, i) => {
      tl.fromTo(w, { y: -160, opacity: 0, rotation: i ? 8 : -8 }, { y: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, 0.25 + i * 0.12);
    });
    tl.fromTo("#mk-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.6);
    // Five real taps on the sentence, each showing the lomda's own next state
    tap("#mk-tap", 737, 828, 1.4);
    moveTap("#mk-tap", 669, 733, 2.1);
    moveTap("#mk-tap", 579, 828, 2.8);
    moveTap("#mk-tap", 858, 733, 3.5);
    moveTap("#mk-tap", 440, 828, 4.2);
    [[1.42, "#mk-s1"], [2.12, "#mk-s2"], [2.82, "#mk-s3"], [3.52, "#mk-s4"], [4.22, "#mk-s5"]].forEach(([t, s]) => tl.to(s, { opacity: 1, duration: 0.08, ease: "none" }, t));
    // The card grows with the lomda's feedback row
    tl.to("#mk-card", { height: 426, duration: 0.3, ease: "power3.out" }, 4.22);
    tl.to("#mk-tap", { opacity: 0, duration: 0.15 }, 4.45);
    burst("#mk-cf", 540, 760, 4.3);
    tl.fromTo("#mk-stamp", { scale: 3, rotation: -25, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 4.5);
    tl.fromTo("#mk-zoom", { x: 0 }, { keyframes: [{ x: -10, duration: 0.04 }, { x: 10, duration: 0.04 }, { x: 0, duration: 0.05 }] }, 4.52);
    // Punch in on the two foundations, then name them
    tl.to(["#mk-stamp", "#mk-t", "#mk-sub"], { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, 5.45);
    tl.to("#mk-zoom", { x: -1447.5, y: -1012.5, scale: 2.5, transformOrigin: "0 0", duration: 0.7, ease: "power3.inOut" }, 5.5);
    tl.fromTo("#mk-nsu", { xPercent: -50, y: -200, opacity: 0, rotation: -14 }, { xPercent: -50, y: 0, opacity: 1, rotation: -5, duration: 0.5, ease: "back.out(2)" }, 6.2);
    tl.fromTo("#mk-nos", { xPercent: -50, y: -200, opacity: 0, rotation: 14 }, { xPercent: -50, y: 0, opacity: 1, rotation: 5, duration: 0.5, ease: "back.out(2)" }, 6.35);
    tl.fromTo("#mk-ok", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 6.6);

    window.__timelines["mark"] = tl;
  </script>
