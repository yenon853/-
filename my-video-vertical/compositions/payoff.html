  <script>
    const tl = gsap.timeline({ paused: true });
    const drawCircuit = (sel, at) => {
      gsap.utils.toArray(`${sel} .cp`).forEach((p, i) => {
        const L = p.getTotalLength();
        tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at + i * 0.07);
      });
      gsap.utils.toArray(`${sel} .cd`).forEach((d, i) => {
        tl.fromTo(d, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at + 0.5 + i * 0.07);
      });
    };
    drawCircuit("#po-circ", 0.2);
    gsap.utils.toArray("#po-t .mask > span").forEach((s, i) => {
      tl.fromTo(s, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.05 + i * 0.12);
    });
    // The student's essay slides up, and a reading bar scans down its marked lines
    tl.fromTo("#po-essay", { y: 900, rotation: -4 }, { y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.2)" }, 0.1);
    tl.fromTo("#po-scan", { y: 90, opacity: 0 }, { y: 440, opacity: 1, duration: 1.4, ease: "power1.inOut" }, 0.75);
    tl.to("#po-scan", { opacity: 0, duration: 0.2 }, 2.15);
    // Then the essay steps back and the lomda's analysis of it arrives
    tl.to("#po-essay", { scale: 0.7, y: -30, transformOrigin: "50% 0%", duration: 0.55, ease: "power3.inOut" }, 2.25);
    tl.fromTo("#po-an", { y: 1000 }, { y: 0, duration: 0.6, ease: "back.out(1.2)" }, 2.45);
    tl.fromTo("#po-st", { scale: 0, rotation: -30 }, { scale: 1, rotation: -7, duration: 0.5, ease: "back.out(2.2)" }, 2.9);
    tl.fromTo("#po-iris", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(120% at 50% 50%)", duration: 0.5, ease: "power2.inOut" }, 4.5);

    window.__timelines["payoff"] = tl;
  </script>
